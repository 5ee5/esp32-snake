[env:esp32-c3]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
; Drop lines buffered before the monitor connected (monitor/filter_fresh.py).
monitor_filters = default, fresh
; Send Serial over the native USB port instead of the UART pins.
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
    olikraus/U8g2

